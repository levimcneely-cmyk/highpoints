<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Peak Profile — Summit Log</title>
<meta name="theme-color" content="#1a2e1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Summit Log">
<meta property="og:type" content="website">
<meta property="og:title" content="Summit Log — US Highpoints">
<meta property="og:image" content="https://levimcneely-cmyk.github.io/highpoints/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --forest: #1a2e1a;
  --moss: #a3c47a;
  --moss-light: #c8dfa8;
  --stone: #f5f0e8;
  --stone-dim: rgba(245,240,232,0.6);
  --card-bg: rgba(255,255,255,0.04);
  --card-border: rgba(163,196,122,0.2);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
html { -webkit-text-size-adjust: 100%; }
body { font-family:'Inter',sans-serif; background:var(--forest); color:var(--stone); min-height:100vh; -webkit-tap-highlight-color:transparent; overflow-x:hidden; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-within { outline:2px solid var(--moss); outline-offset:2px; }

nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:1.1rem 2rem; padding-top:calc(1.1rem + var(--safe-top));
  border-bottom:0.5px solid rgba(163,196,122,0.2);
  position:sticky; top:0; z-index:100; background:var(--forest);
}
.nav-logo { font-family:'Playfair Display',serif; font-size:20px; color:var(--stone); text-decoration:none; }
.nav-logo span { color:var(--moss); }
.nav-links { display:flex; gap:1.75rem; align-items:center; }
nav a { color:var(--moss-light); text-decoration:none; font-size:13px; font-weight:500; opacity:0.85; }
.back-link { display:inline-flex; align-items:center; gap:6px; color:var(--moss-light); text-decoration:none; font-size:13px; padding:1.25rem 2rem 0; opacity:0.8; min-height:44px; }

/* ── HERO ── */
.hero { padding:2rem 2rem 2.5rem; border-bottom:0.5px solid rgba(163,196,122,0.1); display:grid; grid-template-columns:1fr auto; gap:1.5rem; align-items:start; max-width:900px; }
.hero-eyebrow { font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(163,196,122,0.7); margin-bottom:0.5rem; }
.hero-name { font-family:'Playfair Display',serif; font-size:42px; color:var(--stone); line-height:1.1; margin-bottom:0.3rem; }
.hero-state { font-size:16px; color:var(--moss-light); margin-bottom:1.5rem; }
.hero-badge { display:inline-flex; align-items:center; gap:8px; padding:8px 18px; border-radius:30px; font-size:13px; font-weight:500; }
.hero-badge.done { background:rgba(106,181,71,0.15); color:#a3e07a; border:0.5px solid rgba(106,181,71,0.3); }
.hero-badge.todo { background:rgba(185,174,146,0.1); color:#c9bfa4; border:0.5px solid rgba(185,174,146,0.3); }
.hero-elev { text-align:right; }
.elev-num { font-family:'Playfair Display',serif; font-size:52px; color:var(--moss); line-height:1; }
.elev-unit { font-size:13px; color:var(--stone-dim); margin-top:4px; }

/* ── STATS STRIP ── */
.stats-strip { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:0.5px solid rgba(163,196,122,0.1); max-width:900px; }
.strip-stat { padding:1.25rem 2rem; border-right:0.5px solid rgba(163,196,122,0.1); }
.strip-stat:last-child { border-right:none; }
.strip-lbl { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--stone-dim); margin-bottom:6px; }
.strip-val { font-size:20px; font-weight:500; color:var(--stone); }
.strip-sub { font-size:11px; color:var(--stone-dim); margin-top:2px; }

.section { padding:2rem 2rem; max-width:900px; }
.section-title { font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(163,196,122,0.7); margin-bottom:1.25rem; }

/* ── DIFFICULTY ── */
.diff-card { background:var(--card-bg); border:0.5px solid var(--card-border); border-radius:12px; padding:1.5rem; display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; }
.diff-scale-wrap { display:flex; flex-direction:column; gap:10px; }
.diff-row { display:flex; align-items:center; gap:10px; }
.diff-label { font-size:12px; color:var(--stone-dim); width:90px; flex-shrink:0; }
.diff-track { flex:1; height:6px; background:rgba(163,196,122,0.1); border-radius:3px; overflow:hidden; }
.diff-bar { height:100%; border-radius:3px; }
.diff-val { font-size:12px; font-weight:500; color:var(--stone); min-width:44px; text-align:right; }
.effort-display { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; border-left:0.5px solid rgba(163,196,122,0.15); }
.effort-num { font-family:'Playfair Display',serif; font-size:54px; color:var(--moss); line-height:1; }
.effort-denom { font-size:13px; color:var(--stone-dim); margin-top:4px; }
.effort-label { font-size:11px; color:var(--stone-dim); margin-top:8px; letter-spacing:0.06em; text-transform:uppercase; }
.effort-rank { margin-top:6px; font-size:12px; color:var(--moss-light); }

/* ── TRIP REPORT ── */
.trip-card { background:var(--card-bg); border:0.5px solid var(--card-border); border-radius:12px; padding:1.5rem; }
.trip-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; flex-wrap:wrap; gap:8px; }
.trip-title { font-size:15px; font-weight:500; }
.trip-date { font-size:13px; color:var(--moss); margin-top:2px; }
.trip-meta { display:flex; gap:1.5rem; flex-wrap:wrap; margin-bottom:1rem; }
.trip-meta-item { display:flex; flex-direction:column; gap:2px; }
.trip-meta-lbl { font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--stone-dim); }
.trip-meta-val { font-size:13px; }
.trip-notes { border-top:0.5px solid rgba(163,196,122,0.15); padding-top:1rem; font-size:14px; line-height:1.7; color:rgba(245,240,232,0.85); font-style:italic; }
.trip-photo { display:block; width:100%; max-height:420px; object-fit:cover; border-radius:10px; margin-bottom:0.75rem; border:0.5px solid rgba(163,196,122,0.2); }
.thumbs { display:flex; gap:8px; margin-bottom:1.1rem; overflow-x:auto; scrollbar-width:none; }
.thumbs::-webkit-scrollbar { display:none; }
.thumb { flex:none; width:56px; height:56px; border-radius:8px; overflow:hidden; border:1.5px solid transparent; padding:0; background:none; cursor:pointer; opacity:0.65; }
.thumb.on { border-color:var(--moss); opacity:1; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.card-actions { display:flex; align-items:center; gap:10px; margin-top:1rem; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 16px; border-radius:10px; font-size:13px; font-weight:500; font-family:inherit; cursor:pointer; text-decoration:none; border:0.5px solid rgba(163,196,122,0.3); background:rgba(255,255,255,0.06); color:var(--moss-light); }
.btn.primary { background:var(--moss); color:var(--forest); border-color:var(--moss); }
.btn:disabled { opacity:0.6; cursor:default; }
.action-msg { font-size:12px; color:var(--stone-dim); }
.no-summit { text-align:center; padding:1.75rem 1rem; }
.no-summit-text { font-size:15px; color:var(--stone-dim); margin-bottom:1.25rem; }

/* ── ENTRY FORM ── */
.entry-form { margin-top:1.25rem; padding-top:1.25rem; border-top:0.5px solid rgba(163,196,122,0.15); }
.entry-form.solo { margin-top:0; padding-top:0; border-top:none; }
.f-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.f-group { display:flex; flex-direction:column; gap:5px; min-width:0; margin-bottom:10px; }
.f-row .f-group { margin-bottom:0; }
.f-group label { font-size:10px; letter-spacing:0.07em; text-transform:uppercase; color:rgba(245,240,232,0.55); }
.f-group input[type="date"], .f-group input[type="text"], .f-group input[type="password"], .f-group textarea {
  background:rgba(255,255,255,0.06); border:0.5px solid rgba(163,196,122,0.25); border-radius:8px; color:var(--stone);
  font-family:inherit; font-size:16px; padding:10px 12px; outline:none; -webkit-appearance:none; appearance:none; width:100%; min-width:0;
}
.f-group textarea { resize:none; height:80px; }
.f-group input[type="file"] { font-size:13px; color:rgba(245,240,232,0.7); padding:8px 0; width:100%; }
.f-note { font-size:11px; color:rgba(245,240,232,0.4); margin:2px 0 8px; line-height:1.5; }

/* ── LINKS ── */
.links-card { background:var(--card-bg); border:0.5px solid var(--card-border); border-radius:12px; overflow:hidden; }
.link-row { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem; border-bottom:0.5px solid rgba(163,196,122,0.1); text-decoration:none; min-height:56px; }
.link-row:last-child { border-bottom:none; }
.link-row-left { display:flex; align-items:center; gap:10px; }
.link-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; background:rgba(163,196,122,0.1); color:var(--moss); font-weight:500; }
.link-name { font-size:14px; color:var(--stone); }
.link-desc { font-size:12px; color:var(--stone-dim); margin-top:1px; }
.link-arrow { font-size:14px; color:var(--stone-dim); }

/* ── NEARBY ── */
.nearby-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
.nearby-card { background:var(--card-bg); border:0.5px solid var(--card-border); border-radius:10px; padding:1rem 1.1rem; text-decoration:none; display:block; min-height:80px; }
.nearby-state { font-size:13px; font-weight:500; color:var(--stone); }
.nearby-peak { font-size:11px; color:var(--stone-dim); margin-top:2px; }
.nearby-dist { font-size:11px; color:var(--moss); margin-top:6px; }
.nearby-badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:10px; margin-top:4px; }
.nearby-badge.done { background:rgba(106,181,71,0.2); color:#a3e07a; }
.nearby-badge.todo { background:rgba(185,174,146,0.12); color:#c9bfa4; }

.prevnext { display:flex; justify-content:space-between; padding:0 2rem 3rem; max-width:900px; gap:1rem; flex-wrap:wrap; }
.prevnext a { font-size:13px; color:var(--moss-light); text-decoration:none; opacity:0.85; min-height:44px; display:inline-flex; align-items:center; }

footer { border-top:0.5px solid rgba(163,196,122,0.1); padding:1.5rem 2rem; padding-bottom:calc(1.5rem + var(--safe-bottom)); font-size:12px; color:rgba(245,240,232,0.35); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
footer a { color:rgba(163,196,122,0.6); text-decoration:none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; } }

/* ── MOBILE ── */
@media (max-width: 767px) {
  nav { padding:1rem 1.25rem; padding-top:calc(1rem + var(--safe-top)); }
  .nav-links { gap:1.25rem; }
  .nav-links .nav-guide { display:none; }
  .back-link { padding:0.5rem 1.25rem 0; font-size:13px; }
  .hero { grid-template-columns:1fr; padding:1.5rem 1.25rem 2rem; gap:1rem; }
  .hero-name { font-size:30px; }
  .hero-elev { text-align:left; }
  .elev-num { font-size:38px; }
  .stats-strip { grid-template-columns:1fr 1fr; }
  .strip-stat { padding:1rem 1.25rem; }
  .strip-stat:nth-child(2) { border-right:none; }
  .strip-stat:nth-child(-n+2) { border-bottom:0.5px solid rgba(163,196,122,0.1); }
  .strip-val { font-size:17px; }
  .section { padding:1.5rem 1.25rem; }
  .diff-card { grid-template-columns:1fr; gap:1.25rem; }
  .effort-display { border-left:none; border-top:0.5px solid rgba(163,196,122,0.15); padding-top:1.25rem; }
  .trip-card { padding:1.1rem; }
  .links-card .link-row { padding:0.9rem 1.1rem; }
  .nearby-grid { grid-template-columns:1fr 1fr; }
  .prevnext { padding:0 1.25rem 2.5rem; flex-direction:column; }
  footer { flex-direction:column; padding:1.25rem; padding-bottom:calc(1.25rem + var(--safe-bottom)); gap:4px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Summit<span>Log</span></a>
  <div class="nav-links">
    <a href="index.html#map">Map</a>
    <a href="index.html#peaks">Peaks</a>
    <a class="nav-guide" href="https://highpoint.guide" target="_blank" rel="noopener">Highpoint Guide ↗</a>
  </div>
</nav>

<a href="index.html" class="back-link">← Back to map</a>
<main id="page-content"></main>

<footer>
  <span>Built for the summit obsessed</span>
  <span>Data via <a href="https://highpoint.guide" target="_blank" rel="noopener">highpoint.guide</a> · Martin Classification · VanderHeide Effort Scale</span>
</footer>

<script src="data.js"></script>
<script src="util.js"></script>
<script src="sync.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = U.esc;

const stateCode = (new URLSearchParams(location.search).get('state') || '').toUpperCase();
const hp = U.byState[stateCode];

// SUMMITED (data.js) + rows from the Google Sheet
let remote = Sync.cached();
const sumMap = {};
function applySummits() {
  Object.keys(sumMap).forEach(k => delete sumMap[k]);
  Sync.merge(SUMMITED, remote).forEach(s => { sumMap[s.state] = s; });
}
applySummits();

const ui = { formOpen: false, photoIdx: null };

const rankOf = (key, h) => [...HIGHPOINTS].sort((a, b) => b[key] - a[key]).findIndex(x => x.state === h.state) + 1;

function formHTML(log, solo) {
  const needPass = !Sync.getPasscode();
  return `<form class="entry-form ${solo ? 'solo' : ''}" id="entry-form" novalidate>
    <div class="f-row">
      <div class="f-group"><label for="f-date">Date summited</label><input type="date" id="f-date" name="date" value="${esc(log ? log.date : U.todayISO())}" required></div>
      <div class="f-group"><label for="f-partners">Trip partners</label><input type="text" id="f-partners" name="partners" value="${esc(log ? log.partners || '' : '')}" placeholder="Solo, or names"></div>
    </div>
    <div class="f-group"><label for="f-conditions">Conditions</label><input type="text" id="f-conditions" name="conditions" value="${esc(log ? log.conditions || '' : '')}" placeholder="e.g. clear skies, light wind"></div>
    <div class="f-group"><label for="f-notes">Notes</label><textarea id="f-notes" name="notes" placeholder="Trail notes, memories, beta...">${esc(log ? log.notes || '' : '')}</textarea></div>
    <div class="f-group"><label for="f-photo">${log ? 'Add a photo (optional)' : 'Summit photo (optional)'}</label><input type="file" id="f-photo" name="photo" accept="image/*"></div>
    ${needPass ? `<div class="f-group"><label for="f-pass">Passcode</label><input type="password" id="f-pass" name="pass" autocomplete="off" placeholder="Saved on this device"></div>` : ''}
    ${log ? '<p class="f-note">Saving adds an update to your sheet. A blank field keeps its saved value.</p>' : ''}
    <div class="card-actions">
      <button class="btn primary" type="submit" id="f-save">${log ? 'Save changes' : 'Mark summited'}</button>
      ${solo ? '' : '<button class="btn" type="button" id="f-cancel">Cancel</button>'}
      <span class="action-msg" id="f-msg" role="status"></span>
    </div>
  </form>`;
}

function tripReportHTML(log) {
  const canSave = Sync.enabled();
  if (!log) {
    return `<div class="trip-card">
      ${canSave ? (ui.formOpen
        ? `<div class="trip-title" style="margin-bottom:1rem">Log this summit</div>${formHTML(null, true)}`
        : `<div class="no-summit"><div class="no-summit-text">You haven't logged a summit here yet.</div><button class="btn primary" type="button" id="btn-open-form">Log this summit</button></div>`)
        : `<div class="no-summit"><div class="no-summit-text">You haven't logged a summit here yet.</div></div>`}
    </div>`;
  }
  const photos = (log.photos || []).map(U.safeUrl).filter(Boolean);
  const idx = ui.photoIdx != null && ui.photoIdx < photos.length ? ui.photoIdx : photos.length - 1;
  const trip = TRIPS.find(t => t.states.includes(hp.state));
  const meta = [
    log.conditions && ['Conditions', log.conditions],
    log.partners && ['Partners', log.partners],
    trip && ['Trip', trip.name],
    RACES[hp.state] && ['Race trip', RACES[hp.state]],
  ].filter(Boolean).map(m => `<div class="trip-meta-item"><div class="trip-meta-lbl">${m[0]}</div><div class="trip-meta-val">${esc(m[1])}</div></div>`).join('');
  return `<div class="trip-card">
    <div class="trip-header">
      <div><div class="trip-title">Summit log</div><div class="trip-date">${esc(U.fmtDate(log.date, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }))}</div></div>
      ${canSave && !ui.formOpen ? '<button class="btn" type="button" id="btn-open-form">Edit</button>' : ''}
    </div>
    ${photos.length ? `<a id="main-link" href="${esc(photos[idx])}" target="_blank" rel="noopener"><img class="trip-photo" id="main-photo" src="${esc(photos[idx])}" alt="Summit photo at ${esc(hp.peak)}"></a>` : ''}
    ${photos.length > 1 ? `<div class="thumbs">${photos.map((p, i) => `<button class="thumb ${i === idx ? 'on' : ''}" type="button" data-i="${i}" aria-label="Show photo ${i + 1} of ${photos.length}"><img src="${esc(p)}" alt=""></button>`).join('')}</div>` : ''}
    ${meta ? `<div class="trip-meta">${meta}</div>` : ''}
    ${log.notes ? `<div class="trip-notes">"${esc(log.notes)}"</div>` : ''}
    ${canSave ? `<div class="card-actions">
      <label class="btn" for="photo-input" style="cursor:pointer">${photos.length ? 'Add another photo' : 'Add a summit photo'}</label>
      <input type="file" accept="image/*" id="photo-input" hidden>
      <span class="action-msg" id="photo-msg" role="status"></span>
    </div>` : ''}
    ${ui.formOpen ? formHTML(log, false) : ''}
  </div>`;
}

function buildPage() {
  document.title = hp.peak + ' — Summit Log';
  const log = sumMap[hp.state];
  const isDone = !!log;
  const region = U.regionByState[hp.state];

  const nearby = HIGHPOINTS.filter(h => h.state !== hp.state)
    .map(h => ({ ...h, mi: U.haversineMi(hp.lat, hp.lng, h.lat, h.lng) }))
    .sort((a, b) => a.mi - b.mi).slice(0, 4);

  const sorted = [...HIGHPOINTS].sort((a, b) => b.elev - a.elev);
  const i = sorted.findIndex(h => h.state === hp.state);
  const prev = sorted[i - 1], next = sorted[i + 1];

  $('page-content').innerHTML = `
    <div class="hero">
      <div>
        <div class="hero-eyebrow">${hp.state} · ${esc(region || '')} · State highpoint</div>
        <h1 class="hero-name">${esc(hp.peak)}</h1>
        <div class="hero-state">${esc(hp.name)}</div>
        <div class="hero-badge ${isDone ? 'done' : 'todo'}">${isDone ? '✓ Summited' : '○ Not yet'}</div>
      </div>
      <div class="hero-elev">
        <div class="elev-num">${hp.elev.toLocaleString()}</div>
        <div class="elev-unit">feet · #${rankOf('elev', hp)} highest of 50</div>
      </div>
    </div>

    <div class="stats-strip">
      <div class="strip-stat"><div class="strip-lbl">Elevation gain</div><div class="strip-val">${esc(U.gainLabel(hp))}</div><div class="strip-sub">most popular route</div></div>
      <div class="strip-stat"><div class="strip-lbl">Distance</div><div class="strip-val">${hp.dist} mi</div><div class="strip-sub">round trip</div></div>
      <div class="strip-stat"><div class="strip-lbl">Martin difficulty</div><div class="strip-val" style="color:${U.diffColor(hp.diff)}">${hp.diff} / 10</div><div class="strip-sub">technical challenge</div></div>
      <div class="strip-stat"><div class="strip-lbl">VanderHeide effort</div><div class="strip-val">${hp.effort}</div><div class="strip-sub">of 1000</div></div>
    </div>

    <div class="section">
      <div class="section-title">Difficulty &amp; effort</div>
      <div class="diff-card">
        <div class="diff-scale-wrap">
          <div class="diff-row"><div class="diff-label">Technical</div><div class="diff-track"><div class="diff-bar" style="width:${hp.diff * 10}%;background:${U.diffColor(hp.diff)}"></div></div><div class="diff-val" style="color:${U.diffColor(hp.diff)}">${hp.diff}/10</div></div>
          <div class="diff-row"><div class="diff-label">Elevation gain</div><div class="diff-track"><div class="diff-bar" style="width:${Math.min(hp.gain / 25000 * 100, 100)}%;background:#a3c47a"></div></div><div class="diff-val">${hp.gain > 0 ? hp.gain.toLocaleString() : '—'}</div></div>
          <div class="diff-row"><div class="diff-label">Distance</div><div class="diff-track"><div class="diff-bar" style="width:${Math.min(hp.dist / 56 * 100, 100)}%;background:#a3c47a"></div></div><div class="diff-val">${hp.dist} mi</div></div>
          <div style="margin-top:0.5rem;font-size:11px;color:rgba(245,240,232,0.4);line-height:1.5">Martin Classification: subjective 0–10 technical difficulty. Bars are scaled against Denali, the hardest US highpoint.</div>
        </div>
        <div class="effort-display">
          <div class="effort-num">${hp.effort}</div>
          <div class="effort-denom">/ 1000</div>
          <div class="effort-label">VanderHeide effort score</div>
          <div class="effort-rank">#${rankOf('effort', hp)} most demanding of 50</div>
        </div>
      </div>
    </div>

    <div class="section" style="padding-top:0">
      <div class="section-title">Trip report</div>
      ${tripReportHTML(log)}
    </div>

    <div class="section" style="padding-top:0">
      <div class="section-title">Resources</div>
      <div class="links-card">
        <a class="link-row" href="${esc(hp.guide)}" target="_blank" rel="noopener"><div class="link-row-left"><div class="link-icon">G</div><div><div class="link-name">Full guide — highpoint.guide</div><div class="link-desc">Route details, photos, permit info, trip reports</div></div></div><div class="link-arrow">↗</div></a>
        <a class="link-row" href="https://www.google.com/maps/search/?api=1&query=${hp.lat},${hp.lng}" target="_blank" rel="noopener"><div class="link-row-left"><div class="link-icon">M</div><div><div class="link-name">Google Maps</div><div class="link-desc">${hp.lat.toFixed(4)}° N, ${Math.abs(hp.lng).toFixed(4)}° ${hp.lng < 0 ? 'W' : 'E'}</div></div></div><div class="link-arrow">↗</div></a>
        <a class="link-row" href="https://www.alltrails.com/search?q=${encodeURIComponent(hp.peak)}" target="_blank" rel="noopener"><div class="link-row-left"><div class="link-icon">T</div><div><div class="link-name">AllTrails</div><div class="link-desc">Trail maps, reviews, GPX tracks</div></div></div><div class="link-arrow">↗</div></a>
      </div>
    </div>

    <div class="section" style="padding-top:0">
      <div class="section-title">Nearby highpoints</div>
      <div class="nearby-grid">
        ${nearby.map(n => `<a class="nearby-card" href="peak.html?state=${n.state}"><div class="nearby-state">${esc(n.name)}</div><div class="nearby-peak">${esc(n.peak)}</div><div class="nearby-dist">${Math.round(n.mi)} mi away · ${n.elev.toLocaleString()} ft</div><div class="nearby-badge ${sumMap[n.state] ? 'done' : 'todo'}">${sumMap[n.state] ? '✓ Done' : 'Not yet'}</div></a>`).join('')}
      </div>
    </div>

    <div class="prevnext">
      ${prev ? `<a href="peak.html?state=${prev.state}">← ${esc(prev.peak)} (${prev.elev.toLocaleString()} ft)</a>` : '<span></span>'}
      ${next ? `<a href="peak.html?state=${next.state}">${esc(next.peak)} (${next.elev.toLocaleString()} ft) →</a>` : ''}
    </div>`;

  wire();
}

function ensurePasscode() {
  if (Sync.getPasscode()) return true;
  const p = prompt('Passcode');
  if (!p) return false;
  Sync.setPasscode(p.trim());
  return true;
}

function wire() {
  const open = $('btn-open-form');
  if (open) open.addEventListener('click', () => { ui.formOpen = true; buildPage(); const f = $('f-date'); if (f) f.scrollIntoView({ block: 'center' }); });
  const cancel = $('f-cancel');
  if (cancel) cancel.addEventListener('click', () => { ui.formOpen = false; buildPage(); });

  document.querySelectorAll('.thumb').forEach(b => b.addEventListener('click', () => {
    const photos = (sumMap[hp.state].photos || []).map(U.safeUrl).filter(Boolean);
    ui.photoIdx = +b.dataset.i;
    $('main-photo').src = photos[ui.photoIdx]; $('main-link').href = photos[ui.photoIdx];
    document.querySelectorAll('.thumb').forEach(t => t.classList.toggle('on', t === b));
  }));

  const form = $('entry-form');
  if (form) form.addEventListener('submit', async e => {
    e.preventDefault();
    const el = form.elements, msgEl = $('f-msg'), btn = $('f-save');
    const setMsg = (t, bad) => { msgEl.textContent = t; msgEl.style.color = bad ? '#f09595' : ''; };
    if (!el.date.value) { setMsg('Pick a date.', true); return; }
    if (el.pass && el.pass.value.trim()) Sync.setPasscode(el.pass.value.trim());
    if (!Sync.getPasscode()) { setMsg('Enter your passcode.', true); return; }
    const entry = { state: hp.state, date: el.date.value, conditions: el.conditions.value.trim(), partners: el.partners.value.trim(), notes: el.notes.value.trim() };
    btn.disabled = true; const label = btn.textContent; btn.textContent = 'Saving…'; setMsg('');
    try {
      const saved = await Sync.saveSummit(entry, el.photo.files[0]);
      remote.push({ ...entry, photo: saved.photo });
      Sync.setCache(remote);
      applySummits(); ui.formOpen = false; ui.photoIdx = null; buildPage();
    } catch (err) {
      if (/passcode/i.test(err.message)) Sync.setPasscode('');
      setMsg('Couldn’t save: ' + err.message, true);
      btn.disabled = false; btn.textContent = label;
    }
  });

  const pin = $('photo-input');
  if (pin) pin.addEventListener('change', async () => {
    const file = pin.files[0]; if (!file) return;
    const note = $('photo-msg');
    if (!ensurePasscode()) { pin.value = ''; return; }
    note.style.color = ''; note.textContent = 'Uploading…';
    try {
      const log = sumMap[hp.state];
      const url = await Sync.addPhoto(hp.state, log.date, file);
      remote.push({ state: hp.state, date: log.date, photo: url });
      Sync.setCache(remote);
      applySummits(); ui.photoIdx = null; buildPage();
    } catch (err) {
      if (/passcode/i.test(err.message)) Sync.setPasscode('');
      note.style.color = '#f09595'; note.textContent = 'Couldn’t upload: ' + err.message;
    }
  });
}

// ── INIT ──
if (hp) {
  buildPage();
  if (Sync.enabled()) {
    Sync.fetchRemote()
      .then(rows => { remote = rows; applySummits(); if (!ui.formOpen) buildPage(); })
      .catch(err => console.warn('Sheet sync failed; showing saved data.', err));
  }
} else {
  $('page-content').innerHTML = `<div style="text-align:center;padding:4rem 2rem">
    <p style="color:rgba(245,240,232,0.6);margin-bottom:1rem">That state isn't in the list.</p>
    <a href="index.html" style="color:var(--moss)">← Back to the map</a></div>`;
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
